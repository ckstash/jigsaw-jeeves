[project]
name = "jigsaw-jeeves"
version = "0.0.1"
license = { file = "LICENSE" }
description = "Jigsaw Jeeves: a computer-vision assistant for solving jigsaw puzzles"
readme = "README.md"
authors = [
    { name = "Chinmay Kakatkar" }
]
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.11.0",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
]

[project.urls]
Homepage = "https://github.com/ckstash/jigsaw-jeeves"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
